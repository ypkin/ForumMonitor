services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # 限制 WiredTiger 缓存，小内存机器也能跑
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_HOST: "mongodb://mongo:27017/"
    volumes:
      # 配置文件 data/config.json 与运行数据都放这里
      - ./data:/app/data

volumes:
  mongo-data:
